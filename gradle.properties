org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.parallel=false
org.gradle.workers.max=1
# Robolectric fork de test JVM plus gros (le daemon reste à 640m)
android.experimental.testOptions.managedDevices.maxDisabledApiLevel=33
